# Change this to use a non-default directory for Vector data storage:
data_dir = "/mnt/volume_nyc3_01/vector/"

# 1) UDP JSON in
[sources.game]
type            = "socket"
mode            = "udp"
address         = "0.0.0.0:10514"
decoding.codec  = "json"          # zerolog already emits JSON
max_length      = 1024
host_key = ""
#source_type_key = ""

# 2) OPTIONAL transform: drop insanely large durations, etc.
#[transforms.filter_bad]
#type   = "remap"
#inputs = ["game"]

# 3) Loki sink (best-effort)
[sinks.loki]
type                = "loki"
inputs              = ["game"]
endpoint            = "http://127.0.0.1:3100"
encoding.codec      = "json"
labels.job          = "omc"
buffer.type         = "memory"
buffer.max_events   = 20000          # ~½ s backlog at 20 k l/s
buffer.when_full    = "drop_newest"  # prefer loss to back-pressure
request.retry_strategy = "none"
batch.max_events    = 2000
batch.timeout_secs  = 1
batch.when_empty    = "drop"


